name: build

# Pull requests: build, lint, tests and an optional (manually approved) -SNAPSHOT publication to
# GitHub Packages.
# Manual runs: the same as pull requests, optionally against another Zipline version (e.g. a
# -SNAPSHOT published by the Zipline fork's CI) which then ends up in the published snapshot.
# Pushes to tret9_trunk_hermes: bump library_version.txt, build, lint, tests, then publish to Maven
# Central. Cancel the run while it builds to skip publishing a version.
on:
  pull_request: {}
  workflow_dispatch:
    inputs:
      zipline-version:
        description: 'Zipline version to build against, e.g. 1.28.0-composelive-hermes-0.9-abc1234-SNAPSHOT. Empty uses the one from gradle/libs.versions.toml.'
        required: false
        default: ''
        type: string
  push:
    branches:
      - 'tret9_trunk_hermes'
    tags-ignore:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede stale PR and manual runs, but never interrupt a release in progress.
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false -Dkotlin.incremental=false"
  ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version-suffix: ${{ steps.version.outputs.version-suffix }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Pushes use the branch tip rather than github.sha so the bump lands on top of everything
          # merged so far. A PAT/App token is only needed if branch protection blocks GITHUB_TOKEN.
          ref: ${{ github.event_name == 'push' && github.ref_name || '' }}
          token: ${{ github.event_name == 'push' && secrets.RELEASE_BOT_TOKEN || github.token }}

      - name: Bump version
        if: ${{ github.event_name == 'push' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            version=$(.github/scripts/bump-version.sh)
            # [skip ci] keeps a PAT-authored push from starting another release.
            git commit -am "Bump library version to $version" -m '[skip ci]'
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
          done
          echo "Could not push the version bump" >&2
          exit 1

      # Releases use the bumped version as-is; everything else is a snapshot of the current one.
      - name: Resolve version
        id: version
        env:
          # For PRs github.sha is a merge commit that exists only in CI; name snapshots after the
          # PR's head commit instead.
          SNAPSHOT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "version-suffix=-${SNAPSHOT_SHA:0:7}-SNAPSHOT" >> "$GITHUB_OUTPUT"
          fi

  # Builds every publication into a local Maven repository. The publish jobs upload that repository
  # as-is, so what gets published is exactly what was built here.
  build:
    needs:
      - version
    runs-on: macos-latest
    outputs:
      version: ${{ steps.published.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: ./.github/actions/setup-build
        with:
          zipline-version: ${{ inputs.zipline-version }}
          zipline-packages-token: ${{ secrets.ZIPLINE_PACKAGES_TOKEN }}

      # Signing happens in publish-to-maven-central.sh, so that only releases need the key.
      - run: >
          ./gradlew
          -PredwoodNoApps
          -PversionSuffix=${{ needs.version.outputs.version-suffix }}
          -DRELEASE_SIGNING_ENABLED=false
          publishAllPublicationsToLocalMavenRepository

      # The full version is assembled by RedwoodBuildPlugin; read it back from the built repository.
      - name: Read published version
        id: published
        env:
          ZIPLINE_VERSION: ${{ inputs.zipline-version }}
        run: |
          version=$(basename "$(dirname "$(ls build/localMaven/io/github/tret9/redwood-runtime/*/*.pom | head -n 1)")")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Built \`$version\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ZIPLINE_VERSION" ]; then
            echo "against Zipline \`$ZIPLINE_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: maven-repository
          path: build/localMaven
          if-no-files-found: error
          retention-days: 7

  # Lint, API and build checks.
  check-no-tests:
    needs:
      - version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}
          # Spotless compares against its baseline commit, so it needs the history.
          fetch-depth: 0

      # Runs 'git checkout .', so it must come before setup-build edits the version catalog.
      - run: ./scripts/enforce_git_lfs.sh

      - uses: ./.github/actions/setup-build
        with:
          zipline-version: ${{ inputs.zipline-version }}
          zipline-packages-token: ${{ secrets.ZIPLINE_PACKAGES_TOKEN }}

      # Disabling allTests should be enough, but https://youtrack.jetbrains.com/issue/KT-74509
      - run: >
          ./gradlew
          -PredwoodNoApps
          kotlinUpgradeYarnLock
          check
          -x test
          -x allTests
          -x iosSimulatorArm64Test
          -x jsBrowserTest
          -x jsNodeTest
          -x jvmTest

  js-tests:
    needs:
      - version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}
          lfs: true

      - uses: ./.github/actions/setup-build
        with:
          zipline-version: ${{ inputs.zipline-version }}
          zipline-packages-token: ${{ secrets.ZIPLINE_PACKAGES_TOKEN }}

      - run: >
          ./gradlew
          -PredwoodNoApps
          kotlinUpgradeYarnLock
          jsTest

  jvm-tests:
    needs:
      - version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: ./.github/actions/setup-build
        with:
          zipline-version: ${{ inputs.zipline-version }}
          zipline-packages-token: ${{ secrets.ZIPLINE_PACKAGES_TOKEN }}

      - run: >
          ./gradlew
          -PredwoodNoApps
          kotlinUpgradeYarnLock
          test
          jvmTest
          -x dokkaGeneratePublicationHtml

  native-tests:
    needs:
      - version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: ./.github/actions/setup-build
        with:
          zipline-version: ${{ inputs.zipline-version }}
          zipline-packages-token: ${{ secrets.ZIPLINE_PACKAGES_TOKEN }}

      # The uiview layout tests are skipped: with Kotlin 2.3.21 and Burst 2.12.2, Kotlin/Native rejects
      # their parameterized shared tests ("Test function must have no arguments"). Re-enable them
      # (here and in screenshot-tests) once Kotlin and Burst are updated together.
      - run: >
          ./gradlew
          -PredwoodNoApps
          kotlinUpgradeYarnLock
          iosSimulatorArm64Test
          -x :redwood-layout-uiview:iosSimulatorArm64Test
          -x :redwood-lazylayout-uiview:iosSimulatorArm64Test

  emulator-tests:
    needs:
      - version
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: ./.github/actions/setup-build
        with:
          zipline-version: ${{ inputs.zipline-version }}
          zipline-packages-token: ${{ secrets.ZIPLINE_PACKAGES_TOKEN }}

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          emulator-boot-timeout: 20000
          script: ./gradlew connectedCheck -PredwoodNoApps

  screenshot-tests:
    needs:
      - version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}
          lfs: true

      - uses: ./.github/actions/setup-build
        with:
          zipline-version: ${{ inputs.zipline-version }}
          zipline-packages-token: ${{ secrets.ZIPLINE_PACKAGES_TOKEN }}

      - run: ./gradlew verifyPaparazzi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      # Skipped for the same reason as the uiview tests in native-tests: their test framework doesn't
      # compile with Kotlin 2.3.21 and Burst 2.12.2.
      #- run: xcodebuild -project redwood-layout-uiview/RedwoodLayoutUIViewTests.xcodeproj -scheme RedwoodLayoutUIViewTests -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.4' test
      #
      #- run: xcodebuild -project redwood-lazylayout-uiview/RedwoodLazylayoutUIViewTests.xcodeproj -scheme RedwoodLazylayoutUIViewTests -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.4' test

      - run: xcodebuild -project redwood-widget-uiview-test/RedwoodWidgetUIViewTests.xcodeproj -scheme RedwoodWidgetUIViewTests -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.4' test

      - run: ./gradlew redwood-layout-dom:jsBrowserTest

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: screenshot-test-results
          path: |
            /Users/runner/Library/Developer/Xcode/DerivedData/**/Logs/Test/**
            **/build/snapshots/**
          retention-days: 1

  treehouse-host-check:
    needs:
      - version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}
          # Spotless compares against its baseline commit, so it needs the history.
          fetch-depth: 0

      - uses: ./.github/actions/setup-build
        with:
          zipline-version: ${{ inputs.zipline-version }}
          zipline-packages-token: ${{ secrets.ZIPLINE_PACKAGES_TOKEN }}

      # Run the tests that transitively depend on :test-app if it's available.
      - run: ./gradlew :redwood-treehouse-host:check

  sample-counter:
    needs:
      - version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}
          # Spotless compares against its baseline commit, so it needs the history.
          fetch-depth: 0

      - uses: ./.github/actions/setup-build
        with:
          zipline-version: ${{ inputs.zipline-version }}
          zipline-packages-token: ${{ secrets.ZIPLINE_PACKAGES_TOKEN }}

      - run: ./gradlew -p samples/counter build

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Build Counter iOS (UIKit)
        run: xcodebuild -project samples/counter/ios-uikit/CounterApp.xcodeproj -scheme CounterApp -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.4'

  sample-counter-emulator:
    needs:
      - version
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: ./.github/actions/setup-build
        with:
          zipline-version: ${{ inputs.zipline-version }}
          zipline-packages-token: ${{ secrets.ZIPLINE_PACKAGES_TOKEN }}

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          emulator-boot-timeout: 20000
          script: ./gradlew -p samples/counter connectedCheck

  sample-emoji:
    needs:
      - version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}
          # Spotless compares against its baseline commit, so it needs the history.
          fetch-depth: 0

      - uses: ./.github/actions/setup-build
        with:
          zipline-version: ${{ inputs.zipline-version }}
          zipline-packages-token: ${{ secrets.ZIPLINE_PACKAGES_TOKEN }}

      - run: ./gradlew -p samples/emoji-search build

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Build Emoji Search iOS (UIKit)
        run: xcodebuild -project samples/emoji-search/ios-uikit/EmojiSearchApp.xcodeproj -scheme EmojiSearchApp -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.4'

  # Blocked by https://github.com/cashapp/redwood/issues/2698
  #sample-emoji-emulator:
  #  needs:
  #    - version
  #  runs-on: ubuntu-latest
  #  steps:
  #    - name: Enable KVM group perms
  #      run: |
  #        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
  #        sudo udevadm control --reload-rules
  #        sudo udevadm trigger --name-match=kvm
  #
  #    - uses: actions/checkout@v6
  #      with:
  #        ref: ${{ needs.version.outputs.sha }}
  #
  #    - uses: ./.github/actions/setup-build
  #      with:
  #        zipline-version: ${{ inputs.zipline-version }}
  #        zipline-packages-token: ${{ secrets.ZIPLINE_PACKAGES_TOKEN }}
  #
  #    - uses: reactivecircus/android-emulator-runner@v2
  #      with:
  #        api-level: 29
  #        emulator-boot-timeout: 20000
  #        script: ./gradlew -p samples/emoji-search connectedCheck

  test-app:
    needs:
      - version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}
          # Spotless compares against its baseline commit, so it needs the history.
          fetch-depth: 0

      - uses: ./.github/actions/setup-build
        with:
          zipline-version: ${{ inputs.zipline-version }}
          zipline-packages-token: ${{ secrets.ZIPLINE_PACKAGES_TOKEN }}

      - run: ./gradlew -p test-app build

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Build TestApp iOS (UIKit)
        run: xcodebuild -project test-app/ios-uikit/TestApp.xcodeproj -scheme TestApp -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.4'

  # The single check to mark as required in branch protection.
  final-status:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs:
      - version
      - build
      - check-no-tests
      - js-tests
      - jvm-tests
      - native-tests
      - emulator-tests
      - screenshot-tests
      - treehouse-host-check
      - sample-counter
      - sample-counter-emulator
      - sample-emoji
      - test-app
    steps:
      - name: Check
        run: |
          results=$(tr -d '\n' <<< '${{ toJSON(needs.*.result) }}')
          # A skipped job means something it depends on failed.
          if grep -q -E '(failure|cancelled|skipped)' <<< "$results"; then
            echo "One or more required jobs failed"
            exit 1
          fi

  # Manual: runs only after approval in the 'github-packages-snapshot' environment (configure it
  # with required reviewers). Doesn't wait for lint or tests. To publish a snapshot built against a
  # Zipline -SNAPSHOT, start the workflow manually on the PR branch with the 'zipline-version' input.
  publish-snapshot:
    if: ${{ github.event_name != 'push' }}
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    environment: github-packages-snapshot
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: maven-repository

      - run: .github/scripts/publish-to-github-packages.sh maven-repository
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Summary
        env:
          ZIPLINE_VERSION: ${{ inputs.zipline-version }}
        run: |
          {
            echo "Published \`${{ needs.build.outputs.version }}\` to GitHub Packages:"
            echo '```kotlin'
            echo 'maven("https://maven.pkg.github.com/${{ github.repository }}") {'
            echo '  credentials { username = "<github user>"; password = "<token with read:packages>" }'
            echo '}'
            echo '```'
            if [ -n "$ZIPLINE_VERSION" ]; then
              echo "It depends on Zipline \`$ZIPLINE_VERSION\`, so also add the Zipline repository:"
              echo '```kotlin'
              echo 'maven("https://maven.pkg.github.com/tret9/zipline") {'
              echo '  credentials { username = "<github user>"; password = "<token with read:packages>" }'
              echo '}'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: ${{ github.event_name == 'push' && github.repository == 'tret9/redwood' }}
    needs:
      - version
      - build
      - final-status
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: maven-repository

      - run: .github/scripts/publish-to-maven-central.sh maven-repository "redwood ${{ needs.build.outputs.version }}"
        env:
          SONATYPE_CENTRAL_USERNAME: ${{ secrets.SONATYPE_CENTRAL_USERNAME }}
          SONATYPE_CENTRAL_PASSWORD: ${{ secrets.SONATYPE_CENTRAL_PASSWORD }}
          GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          GPG_SECRET_PASSPHRASE: ${{ secrets.GPG_SECRET_PASSPHRASE }}
