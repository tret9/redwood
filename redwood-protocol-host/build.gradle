import static app.cash.redwood.buildsupport.TargetGroup.Common

redwoodBuild {
  targets(Common)
  publishing()
}

apply plugin: 'com.github.gmazzo.buildconfig'
apply plugin: 'dev.drewhamilton.poko'

kotlin {
  sourceSets {
    commonMain {
      kotlin.srcDir(redwoodBuild.generateComposeHelpers(tasks, 'app.cash.redwood.protocol.host'))
      dependencies {
        api projects.redwoodProtocol
        api projects.redwoodWidget
        api projects.redwoodLeakDetector
        implementation libs.androidx.collection
        compileOnly libs.zipline.bridge.annotations
      }
    }
    commonTest {
      dependencies {
        implementation libs.kotlin.test
        implementation libs.assertk
        implementation projects.testApp.schema.compose
        implementation projects.testApp.schema.testing
        implementation projects.testApp.schema.protocolHost
      }
    }
  }
}

kotlin.sourceSets.nativeMain {
  kotlin.srcDir("${buildDir}/generated/bridge/native")
  dependencies {
    implementation libs.zipline
  }
}

// Ensure JVM compilation (which generates native bridge sources) runs first
tasks.matching { it.name.startsWith("compileKotlinIos") || it.name.contains("ourcesJar") || it.name.contains("NativeMain") }.configureEach {
  dependsOn(tasks.named("compileKotlinJvm"))
}

dependencies {
  kotlinCompilerPluginClasspath libs.zipline.bridge.kotlin.plugin
}

buildConfig {
  useKotlinOutput {
    topLevelConstants = true
  }

  className("Version")
  packageName('app.cash.redwood.protocol.host')
  buildConfigField(
    "app.cash.redwood.protocol.RedwoodVersion",
    "hostRedwoodVersion",
    "RedwoodVersion(\"${project.version}\")",
  )
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
  compilerOptions.freeCompilerArgs.addAll(
    '-P', "plugin:app.cash.zipline.bridge.kotlin:cOutputDir=${buildDir}/generated/bridge/c",
    '-P', "plugin:app.cash.zipline.bridge.kotlin:nativeOutputDir=${buildDir}/generated/bridge/native"
  )
}
// Only the JVM target's compilation generates bridge C files (the Android
// compilation tasks are also KotlinJvmCompile but don't have the plugin).
tasks.named('compileKotlinJvm').configure {
  outputs.dir("${buildDir}/generated/bridge/c")
  outputs.dir("${buildDir}/generated/bridge/native")
}

