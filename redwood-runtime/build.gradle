import static app.cash.redwood.buildsupport.TargetGroup.CommonWithAndroid

redwoodBuild {
  targets(CommonWithAndroid)
  publishing()
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'dev.drewhamilton.poko'

kotlin {
  sourceSets {
    commonMain {
      dependencies {
        implementation libs.androidx.compose.runtime
        implementation libs.kotlinx.serialization.core
        compileOnly libs.zipline.bridge.annotations
        api libs.zipline.bridge.annotations
      }
    }
    commonTest {
      dependencies {
        implementation libs.kotlin.test
        implementation libs.assertk
      }
    }
  }
}

dependencies {
  kotlinCompilerPluginClasspath libs.zipline.bridge.kotlin.plugin
  constraints {
    commonMainApi("org.jetbrains.compose.runtime:runtime:1.9.0") {
      because('AndroidX publishes multiplatform version. The JetBrains artifact is now empty.')
    }
  }
}

android {
  namespace = 'app.cash.redwood.runtime'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
  compilerOptions.freeCompilerArgs.addAll(
    '-P', "plugin:app.cash.zipline.bridge.kotlin:cOutputDir=${buildDir}/generated/bridge/c",
    '-P', "plugin:app.cash.zipline.bridge.kotlin:nativeOutputDir=${buildDir}/generated/bridge/native"
  )
}
tasks.named('compileKotlinJvm').configure {
  outputs.dir("${buildDir}/generated/bridge/c")
  outputs.dir("${buildDir}/generated/bridge/native")
}
tasks.matching { it.name == "compileNativeMainKotlinMetadata" }.configureEach {
  dependsOn(tasks.named("compileKotlinJvm"))
}

kotlin.sourceSets.nativeMain {
  kotlin.srcDir("${buildDir}/generated/bridge/native")
  dependencies {
    implementation libs.zipline
  }
}
tasks.matching { it.name.startsWith("compileKotlinIos") || it.name.contains("ourcesJar") || it.name.contains("NativeMain") }.configureEach {
  dependsOn(tasks.named("compileKotlinJvm"))
}

kotlin.sourceSets.jsMain {
  kotlin.srcDir("${buildDir}/generated/bridge/c")
}
tasks.named('compileKotlinJs').configure { dependsOn('compileKotlinJvm') }

spotless {
  kotlin {
    targetExclude(
      // Apache 2-licensed files from AOSP.
      "src/commonMain/kotlin/app/cash/redwood/Modifier.kt",
    )
  }
}

// The Kotlin/Native compilations need the bridge compiler plugin as well.
//
// `kotlinCompilerPluginClasspath` above covers the JVM compilation, which is the generator, but it does
// not reach Kotlin/Native. The generated bridge text the native compilation builds calls
// `bridgeCreate`, and that function exists only because the plugin's FIR extension declares it -- so a
// native compilation without the plugin fails on the generated file with "Unresolved reference
// 'Bridge'", naming a function the generator can see and the compiler cannot.
def ziplineBridgeNativePlugin = configurations.create('ziplineBridgeNativePlugin') {
  canBeResolved = true
  canBeConsumed = false
}
dependencies.add(ziplineBridgeNativePlugin.name, libs.zipline.bridge.kotlin.plugin)

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinNativeCompile).configureEach {
  inputs.files(ziplineBridgeNativePlugin).withPropertyName('ziplineBridgeNativePlugin')
  compilerOptions.freeCompilerArgs.addAll(
    provider {
      ziplineBridgeNativePlugin.files.collect { jar -> "-Xplugin=${jar.absolutePath}" }
    }
  )
  // A directory of its own: run without it and the native compilation regenerates the bridge text into
  // the JVM compilation's output directory, so whichever ran last silently wins.
  def nativeGenerated = layout.buildDirectory.dir("generated/bridge/native-native/$name")
  outputs.dir(nativeGenerated)
  compilerOptions.freeCompilerArgs.addAll(
    provider {
      ['-P', "plugin:app.cash.zipline.bridge.kotlin:nativeOutputDir=${nativeGenerated.get().asFile.absolutePath}"]
    }
  )
}
